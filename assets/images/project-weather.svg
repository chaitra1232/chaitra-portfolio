<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="weatherBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140c1f"/>
      <stop offset="100%" stop-color="#080512"/>
    </linearGradient>
    <linearGradient id="sunGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff1744"/>
      <stop offset="50%" stop-color="#ff2a85"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#1e1038"/>
    </linearGradient>
    <filter id="weatherGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="360" rx="16" fill="url(#weatherBg)"/>

  <!-- Left Main Weather Card -->
  <g transform="translate(40, 30)">
    <rect width="250" height="250" rx="14" fill="#110a1f" stroke="#ff2a85" stroke-width="1.5"/>

    <!-- City & Status -->
    <text x="24" y="38" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700">Bengaluru, IN</text>
    <text x="24" y="56" fill="#a1a1aa" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Partly Cloudy • Radar Live</text>

    <!-- Sun and Cloud Graphic -->
    <g transform="translate(40, 75)">
      <!-- Glowing Sun -->
      <circle cx="85" cy="45" r="32" fill="url(#sunGlow)" filter="url(#weatherGlow)"/>
      <g stroke="#ff2a85" stroke-width="2" stroke-linecap="round" opacity="0.6">
        <line x1="85" y1="5" x2="85" y2="-5"/>
        <line x1="125" y1="45" x2="135" y2="45"/>
        <line x1="113" y1="17" x2="120" y2="10"/>
        <line x1="57" y1="17" x2="50" y2="10"/>
      </g>
      <!-- Stylized Cyber Cloud -->
      <path d="M 25 75 C 25 55, 45 42, 65 48 C 75 32, 105 32, 118 45 C 130 45, 142 55, 140 75 Z" fill="url(#cloudGrad)" stroke="#a855f7" stroke-width="1.8"/>
    </g>

    <!-- Large Temperature Display -->
    <text x="24" y="195" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="44" font-weight="800">26°C</text>
    <text x="145" y="175" fill="#00f5d4" font-family="sans-serif" font-size="12" font-weight="600">Feels like 27°C</text>
    <text x="145" y="195" fill="#a855f7" font-family="sans-serif" font-size="11">H: 29° • L: 20°</text>

    <!-- Parameters row -->
    <line x1="20" y1="210" x2="230" y2="210" stroke="rgba(255, 42, 133, 0.2)"/>
    <text x="24" y="232" fill="#a1a1aa" font-family="sans-serif" font-size="10">Humidity: 68%</text>
    <text x="110" y="232" fill="#a1a1aa" font-family="sans-serif" font-size="10">Wind: 14 km/h</text>
    <text x="195" y="232" fill="#a1a1aa" font-family="sans-serif" font-size="10">UV: 4</text>
  </g>

  <!-- Right Forecast & Radar Panel -->
  <g transform="translate(310, 30)">
    <!-- 7-Day Forecast Mini Cards -->
    <rect width="250" height="150" rx="14" fill="#0e081c" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="18" y="26" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700">7-Day Forecast</text>

    <!-- Day 1 -->
    <g transform="translate(18, 42)">
      <text x="0" y="12" fill="#d1d5db" font-family="sans-serif" font-size="10" font-weight="600">Mon</text>
      <circle cx="55" cy="9" r="6" fill="#ff2a85"/>
      <rect x="80" y="6" width="100" height="6" rx="3" fill="#1f1437"/>
      <rect x="80" y="6" width="65" height="6" rx="3" fill="#ff2a85"/>
      <text x="195" y="12" fill="#ffffff" font-family="sans-serif" font-size="10">28° / 21°</text>
    </g>

    <!-- Day 2 -->
    <g transform="translate(18, 68)">
      <text x="0" y="12" fill="#d1d5db" font-family="sans-serif" font-size="10" font-weight="600">Tue</text>
      <circle cx="55" cy="9" r="6" fill="#a855f7"/>
      <rect x="80" y="6" width="100" height="6" rx="3" fill="#1f1437"/>
      <rect x="80" y="6" width="80" height="6" rx="3" fill="#a855f7"/>
      <text x="195" y="12" fill="#ffffff" font-family="sans-serif" font-size="10">26° / 20°</text>
    </g>

    <!-- Day 3 -->
    <g transform="translate(18, 94)">
      <text x="0" y="12" fill="#d1d5db" font-family="sans-serif" font-size="10" font-weight="600">Wed</text>
      <circle cx="55" cy="9" r="6" fill="#00f5d4"/>
      <rect x="80" y="6" width="100" height="6" rx="3" fill="#1f1437"/>
      <rect x="80" y="6" width="55" height="6" rx="3" fill="#00f5d4"/>
      <text x="195" y="12" fill="#ffffff" font-family="sans-serif" font-size="10">27° / 19°</text>
    </g>

    <!-- Day 4 -->
    <g transform="translate(18, 120)">
      <text x="0" y="12" fill="#d1d5db" font-family="sans-serif" font-size="10" font-weight="600">Thu</text>
      <circle cx="55" cy="9" r="6" fill="#ff1744"/>
      <rect x="80" y="6" width="100" height="6" rx="3" fill="#1f1437"/>
      <rect x="80" y="6" width="90" height="6" rx="3" fill="#ff1744"/>
      <text x="195" y="12" fill="#ffffff" font-family="sans-serif" font-size="10">30° / 22°</text>
    </g>

    <!-- Interactive Search & Geo Bar -->
    <rect y="165" width="250" height="42" rx="10" fill="#150d27" stroke="rgba(255, 42, 133, 0.4)"/>
    <text x="16" y="190" fill="#a1a1aa" font-family="sans-serif" font-size="11">🔍 Search city or coordinate...</text>
    <rect x="185" y="171" width="55" height="30" rx="6" fill="#ff2a85"/>
    <text x="198" y="191" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">Fetch</text>
  </g>

  <!-- Bottom Tech Badges -->
  <g transform="translate(40, 305)">
    <rect x="0" y="0" width="80" height="28" rx="6" fill="#170d2b" stroke="#ff2a85" stroke-width="1"/>
    <text x="16" y="18" fill="#ff2a85" font-family="sans-serif" font-size="10" font-weight="600">HTML5</text>

    <rect x="90" y="0" width="75" height="28" rx="6" fill="#170d2b" stroke="#a855f7" stroke-width="1"/>
    <text x="108" y="18" fill="#a855f7" font-family="sans-serif" font-size="10" font-weight="600">CSS3</text>

    <rect x="175" y="0" width="100" height="28" rx="6" fill="#170d2b" stroke="#00f5d4" stroke-width="1"/>
    <text x="190" y="18" fill="#00f5d4" font-family="sans-serif" font-size="10" font-weight="600">Vanilla JS</text>

    <rect x="285" y="0" width="130" height="28" rx="6" fill="#170d2b" stroke="#ff1744" stroke-width="1"/>
    <text x="300" y="18" fill="#ff1744" font-family="sans-serif" font-size="10" font-weight="600">OpenWeather API</text>
  </g>
</svg>
