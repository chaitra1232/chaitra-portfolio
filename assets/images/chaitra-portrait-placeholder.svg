<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180e29"/>
      <stop offset="50%" stop-color="#0e0a16"/>
      <stop offset="100%" stop-color="#050308"/>
    </linearGradient>
    
    <linearGradient id="neonPinkPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a85"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <linearGradient id="crimsonGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff1744"/>
      <stop offset="100%" stop-color="#ff2a85"/>
    </linearGradient>

    <radialGradient id="haloGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ff2a85" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#8b5cf6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#050308" stop-opacity="0"/>
    </radialGradient>

    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" rx="32" fill="url(#bgGrad)"/>

  <!-- Glowing Ambient Circles -->
  <circle cx="250" cy="210" r="170" fill="url(#haloGlow)"/>
  <circle cx="160" cy="180" r="80" fill="#ff2a85" opacity="0.18" filter="url(#softGlow)"/>
  <circle cx="340" cy="220" r="90" fill="#a855f7" opacity="0.18" filter="url(#softGlow)"/>

  <!-- Geometric Sci-Fi Grid Accents -->
  <g opacity="0.15" stroke="#ff2a85" stroke-width="1">
    <circle cx="250" cy="220" r="190" fill="none" stroke-dasharray="6 8"/>
    <circle cx="250" cy="220" r="140" fill="none" stroke-dasharray="4 6"/>
    <line x1="60" y1="220" x2="440" y2="220"/>
    <line x1="250" y1="40" x2="250" y2="400"/>
  </g>

  <!-- Silhouette & Aesthetic Tech Portrait Avatar -->
  <g transform="translate(0, 10)">
    <!-- Shoulders / Torso -->
    <path d="M 120 460 C 130 380, 180 340, 250 340 C 320 340, 370 380, 380 460 Z" fill="#131022" stroke="url(#neonPinkPurple)" stroke-width="2"/>
    <!-- Collar Detail -->
    <path d="M 210 340 L 250 385 L 290 340" fill="none" stroke="#ff2a85" stroke-width="2.5" opacity="0.8"/>
    <path d="M 225 355 L 250 395 L 275 355" fill="none" stroke="#a855f7" stroke-width="2" opacity="0.6"/>

    <!-- Neck -->
    <path d="M 225 290 L 225 345 L 275 345 L 275 290 Z" fill="#1c162e"/>
    <path d="M 225 295 C 225 330, 275 330, 275 295" fill="none" stroke="#ff2a85" stroke-width="1" opacity="0.4"/>

    <!-- Head & Face Base -->
    <ellipse cx="250" cy="220" rx="65" ry="85" fill="#1b152d"/>

    <!-- Hair Silhouette - Elegant wavy professional style -->
    <path d="M 175 220 C 170 140, 210 110, 250 110 C 290 110, 330 140, 325 220 C 330 260, 320 310, 305 330 C 295 300, 300 250, 290 220 C 280 180, 275 160, 250 160 C 225 160, 220 180, 210 220 C 200 250, 205 300, 195 330 C 180 310, 170 260, 175 220 Z" fill="#241a3a" stroke="url(#neonPinkPurple)" stroke-width="1.5"/>

    <!-- Hair Highlights -->
    <path d="M 200 150 C 220 125, 250 120, 280 135" fill="none" stroke="#ff2a85" stroke-width="3" stroke-linecap="round" filter="url(#glowFilter)"/>
    <path d="M 185 190 C 180 230, 185 270, 195 300" fill="none" stroke="#a855f7" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 315 190 C 320 230, 315 270, 305 300" fill="none" stroke="#ff1744" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Neon Rim Lights on Jaw and Face -->
    <path d="M 195 230 C 200 285, 230 310, 250 310 C 270 310, 300 285, 305 230" fill="none" stroke="url(#neonPinkPurple)" stroke-width="2" filter="url(#glowFilter)"/>

    <!-- Tech Visor / Glasses with Neon Pink/Cyan HUD Accent -->
    <g filter="url(#glowFilter)">
      <path d="M 205 210 C 220 205, 240 208, 250 210 C 260 208, 280 205, 295 210 L 290 226 C 275 223, 260 224, 250 226 C 240 224, 225 223, 210 226 Z" fill="rgba(255, 42, 133, 0.25)" stroke="#ff2a85" stroke-width="2"/>
      <line x1="220" y1="218" x2="240" y2="218" stroke="#00f5d4" stroke-width="2" stroke-linecap="round"/>
      <line x1="260" y1="218" x2="280" y2="218" stroke="#00f5d4" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Sleek Studio Headphones -->
    <g>
      <!-- Headband -->
      <path d="M 175 210 C 170 130, 330 130, 325 210" fill="none" stroke="#ff2a85" stroke-width="6" stroke-linecap="round" filter="url(#glowFilter)"/>
      <path d="M 175 210 C 170 130, 330 130, 325 210" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
      <!-- Left Ear Cup -->
      <rect x="162" y="195" width="22" height="45" rx="8" fill="#131022" stroke="#ff2a85" stroke-width="2.5" filter="url(#glowFilter)"/>
      <circle cx="173" cy="217" r="4" fill="#ff1744"/>
      <!-- Right Ear Cup -->
      <rect x="316" y="195" width="22" height="45" rx="8" fill="#131022" stroke="#a855f7" stroke-width="2.5" filter="url(#glowFilter)"/>
      <circle cx="327" cy="217" r="4" fill="#a855f7"/>
    </g>
  </g>

  <!-- Notice Banner / Placeholder Tag -->
  <g transform="translate(75, 415)">
    <rect width="350" height="60" rx="14" fill="#0d0a17" stroke="url(#neonPinkPurple)" stroke-width="1.8" opacity="0.95"/>
    <!-- Camera Icon -->
    <g transform="translate(20, 18)" stroke="#ff2a85" stroke-width="2" fill="none">
      <path d="M 4 6 L 8 2 L 16 2 L 20 6 L 22 6 C 23.1 6 24 6.9 24 8 L 24 20 C 24 21.1 23.1 22 22 22 L 2 22 C 0.9 22 0 21.1 0 20 L 0 8 C 0 6.9 0.9 6 2 6 Z"/>
      <circle cx="12" cy="14" r="5"/>
    </g>
    <!-- Text -->
    <text x="56" y="27" fill="#ffffff" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="1">PORTRAIT PLACEHOLDER</text>
    <text x="56" y="44" fill="#a1a1aa" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11">Replace file in assets/images/chaitra-portrait.jpg</text>
  </g>
</svg>
